name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  publish:
    runs-on: ubuntu-latest
    needs: test
    # Trusted Publisher（OIDC）。NPM_TOKEN を Secrets に持たず、GitHub Actions の id-token で認証する
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Node 24 は npm 11 を同梱しており、Trusted Publisher に必要な npm のアップデートが不要
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run build
      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PACKAGE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PACKAGE_VERSION"
      # `npx publish` は別物の古いパッケージを起動するので、必ず `npm publish`
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
